<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Stargazers log</h1>
      <p class="subtitle">A log of the repositories I've starred.</p>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite">Loading repositories…</p>
      <ul id="starred-list" class="starred-list" aria-label="Starred repositories"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
